<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comentarios - Guardianes del Planeta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #14141d, #2e285b, #1193fc, #2b3c4a);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .game-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        .game-image {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
        }
        
        .game-info h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .rating {
            color: gold;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        
        .comments-count {
            color: #ccc;
            font-size: 0.9rem;
        }
        
        .comments-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .comment {
            display: flex;
            gap: 10px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .comment:last-child {
            border-bottom: none;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #4a90e2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .comment-content {
            flex: 1;
        }
        
        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .username {
            font-weight: bold;
        }
        
        .comment-date {
            color: #ccc;
            font-size: 0.8rem;
        }
        
        .comment-text {
            line-height: 1.4;
        }
        
        .add-comment-btn {
            background: #1da1f2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        
        .add-comment-btn:hover {
            background: #0d8bd9;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: #15202b;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            padding: 20px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .modal-title {
            font-size: 1.3rem;
            font-weight: bold;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #38444d;
            background: #253341;
            color: white;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .submit-btn {
            background: #1da1f2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #8899a6;
        }
        
        .empty-state p {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Cabecera del juego -->
        <div class="game-header">
            <img src="juegocap.png" alt="Guardianes del Planeta" class="game-image">
            <div class="game-info">
                <h1>Guardianes del Planeta</h1>
                <div class="rating">★★★★☆</div>
                <div class="comments-count" id="commentsCount">0 comentarios</div>
            </div>
        </div>
        
        <!-- Sección de comentarios -->
        <div class="comments-section" id="commentsSection">
            <!-- Los comentarios se cargarán aquí -->
            <div class="empty-state">
                <p>No hay comentarios todavía</p>
                <p>Sé el primero en comentar</p>
            </div>
        </div>
        
        <!-- Botón para añadir comentario -->
        <button class="add-comment-btn" id="addCommentBtn">Añadir comentario</button>
        
        <!-- Modal para escribir comentario -->
        <div class="modal" id="commentModal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">Escribe tu comentario</div>
                    <button class="close-btn" id="closeModal">&times;</button>
                </div>
                <form id="commentForm">
                    <div class="form-group">
                        <label for="username">Nombre de usuario</label>
                        <input type="text" id="username" required placeholder="Escribe tu nombre">
                    </div>
                    <div class="form-group">
                        <label for="commentText">Comentario</label>
                        <textarea id="commentText" required placeholder="Escribe tu comentario aquí..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Publicar comentario</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Elementos del DOM
        const addCommentBtn = document.getElementById('addCommentBtn');
        const commentModal = document.getElementById('commentModal');
        const closeModal = document.getElementById('closeModal');
        const commentForm = document.getElementById('commentForm');
        const commentsSection = document.getElementById('commentsSection');
        const commentsCount = document.getElementById('commentsCount');
        
        // Cargar comentarios al iniciar
        loadComments();
        
        // Abrir modal al hacer clic en el botón
        addCommentBtn.addEventListener('click', function() {
            commentModal.style.display = 'flex';
        });
        
        // Cerrar modal
        closeModal.addEventListener('click', function() {
            commentModal.style.display = 'none';
        });
        
        // Enviar formulario de comentario
        commentForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const commentText = document.getElementById('commentText').value;
            
            if (username && commentText) {
                // Crear objeto de comentario
                const comment = {
                    id: Date.now(),
                    username: username,
                    text: commentText,
                    date: new Date().toLocaleDateString('es-ES')
                };
                
                // Guardar comentario
                saveComment(comment);
                
                // Recargar comentarios
                loadComments();
                
                // Cerrar modal y limpiar formulario
                commentModal.style.display = 'none';
                commentForm.reset();
                
                alert('¡Comentario publicado!');
            }
        });
        
        // Guardar comentario en localStorage
        function saveComment(comment) {
            let comments = JSON.parse(localStorage.getItem('gameComments')) || [];
            comments.unshift(comment); // Añadir al principio
            localStorage.setItem('gameComments', JSON.stringify(comments));
        }
        
        // Cargar comentarios desde localStorage
        function loadComments() {
            const comments = JSON.parse(localStorage.getItem('gameComments')) || [];
            
            // Actualizar contador
            commentsCount.textContent = `${comments.length} comentario${comments.length !== 1 ? 's' : ''}`;
            
            // Mostrar comentarios
            if (comments.length === 0) {
                commentsSection.innerHTML = `
                    <div class="empty-state">
                        <p>No hay comentarios todavía</p>
                        <p>Sé el primero en comentar</p>
                    </div>
                `;
            } else {
                commentsSection.innerHTML = '';
                comments.forEach(comment => {
                    const firstLetter = comment.username.charAt(0).toUpperCase();
                    
                    const commentElement = document.createElement('div');
                    commentElement.className = 'comment';
                    commentElement.innerHTML = `
                        <div class="user-avatar">${firstLetter}</div>
                        <div class="comment-content">
                            <div class="comment-header">
                                <div class="username">${comment.username}</div>
                                <div class="comment-date">${comment.date}</div>
                            </div>
                            <div class="comment-text">${comment.text}</div>
                        </div>
                    `;
                    
                    commentsSection.appendChild(commentElement);
                });
            }
        }
        
        // Cerrar modal si se hace clic fuera del contenido
        window.addEventListener('click', function(e) {
            if (e.target === commentModal) {
                commentModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
